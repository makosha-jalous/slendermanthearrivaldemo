name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ForgeGradle 5 (Minecraft 1.19.2) needs Gradle 7.x, so the version is pinned here
      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4

      - name: Build
        run: gradle build --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: slenderman-mod
          path: build/libs/*.jar
          if-no-files-found: error
